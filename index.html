<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Salgard E Eshgh ❤️</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-image: url("IMG_2837.jpeg");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            overflow: hidden;

            position: relative;
        }


        /* لایه بسیار ملایم برای خوانایی */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.05),
                    rgba(0,0,0,0.12)
                );

            pointer-events: none;

            z-index: 0;
        }


        /* عنوان آهنگ */

        .song-info {

            position: fixed;

            top: 45px;

            left: 25px;

            z-index: 2;

            direction: ltr;

            text-align: left;

            color: white;

            max-width: 220px;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.7);
        }


        .song-info h1 {

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 8px;

            line-height: 1.2;
        }


        .song-info p {

            font-size: 15px;

            color:
                rgba(255,255,255,0.9);
        }


        /* پلیر و متن پایین */

        .music-box {

            position: fixed;

            bottom: 35px;

            left: 20px;

            z-index: 2;

            width: min(280px, 75vw);

            padding: 16px;

            border-radius: 22px;

            background:
                rgba(0,0,0,0.28);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            border:
                1px solid
                rgba(255,255,255,0.18);

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.25);
        }


        /* پلیر کوچک */

        audio {

            width: 100%;

            height: 38px;

            display: block;
        }


        /* متن عاشقانه */

        .message {

            margin-top: 14px;

            color: white;

            font-size: 13px;

            line-height: 1.8;

            text-align: right;

            text-shadow:
                0 1px 5px rgba(0,0,0,0.8);
        }


        /* قلب */

        .heart {

            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 2;

            font-size: 28px;

            animation:
                heartbeat 1.5s infinite;
        }


        @keyframes heartbeat {

            0%, 100% {

                transform: scale(1);
            }

            50% {

                transform: scale(1.15);
            }
        }


        /* تنظیمات مخصوص گوشی */

        @media (max-width: 480px) {

            .song-info {

                top: 35px;

                left: 18px;

                max-width: 180px;
            }


            .song-info h1 {

                font-size: 23px;
            }


            .song-info p {

                font-size: 13px;
            }


            .music-box {

                left: 15px;

                bottom: 25px;

                width: 240px;

                padding: 13px;
            }


            .message {

                font-size: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- عنوان آهنگ -->

    <div class="song-info">

        <h1>
            Salgard E Eshgh ❤️
        </h1>

        <p>
            Our Love Story
        </p>

    </div>


    <!-- قلب -->

    <div class="heart">
        ❤️
    </div>


    <!-- پلیر و متن -->

    <div class="music-box">


        <audio controls>

            <source
                src="Screen_Recording_20260907-132214.mp3"
                type="audio/mpeg">

            مرورگر شما از پخش فایل صوتی پشتیبانی نمی‌کند.

        </audio>


        <div class="message">

            بعضی لحظه‌ها فقط یک بار اتفاق می‌افتند،
            اما بعضی آدم‌ها برای همیشه
            در قلبت می‌مانند. ❤️

        </div>


    </div>


</body>

</html>
